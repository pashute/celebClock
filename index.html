<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CelebClock</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #080810;
  --face-bg: #0d0d1a;
  --gold: #c8a84b;
  --gold-bright: #f0d060;
  --orange: #e87020;
  --orange-bright: #ff9040;
  --white: #eeebe4;
  --dim: #44445a;
  --dimmer: #2a2a3a;
  --tick-color: #6060a0;
  --tick-hour: #9090c0;
  --active-tick: #c8a84b;
  --cs: 500px;
  --img-crop-r: 197px;
  --img-scale: 0.85;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--white);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.8rem;
  letter-spacing: 0.25em;
  color: var(--gold);
  margin-bottom: 8px;
  text-shadow: 0 0 30px rgba(200, 168, 75, 0.3);
}

#mode-banner {
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 4px 16px;
  border-radius: 20px;
  margin-bottom: 18px;
  border: 1px solid var(--gold);
  color: var(--gold);
  background: rgba(200, 168, 75, 0.08);
  transition: all 0.25s;
}

#mode-banner.hour-mode {
  border-color: var(--orange);
  color: var(--orange-bright);
  background: rgba(232, 112, 32, 0.1);
}

.clock-wrap {
  position: relative;
  width: var(--cs);
  height: var(--cs);
}

#celeb-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  pointer-events: none;
  border-radius: 50%;
  overflow: hidden;
  -webkit-clip-path: circle(var(--img-crop-r) at 50% 50%);
  clip-path: circle(var(--img-crop-r) at 50% 50%);
}

#celeb-img {
  width: calc(var(--img-crop-r) * 2);
  height: calc(var(--img-crop-r) * 2);
  object-fit: contain;
  object-position: center center;
  transform: scale(var(--img-scale));
  transform-origin: center center;
  opacity: 0.92;
  transition: opacity 0.5s ease;
  filter: drop-shadow(0 0 24px rgba(200, 168, 75, 0.3));
  display: none;
}

#clock-svg {
  position: absolute;
  inset: 0;
  z-index: 2;
}

#hour-hand {
  stroke: var(--gold-bright);
  stroke-width: 6;
  stroke-linecap: round;
  cursor: pointer;
  filter: drop-shadow(0 0 5px rgba(240, 208, 96, 0.7));
  transition: stroke 0.2s, filter 0.2s;
}

#hour-hand.hour-mode {
  stroke: var(--orange-bright);
  filter: drop-shadow(0 0 8px rgba(255, 144, 64, 0.9));
  cursor: default;
}

#celeb-name-label {
  position: absolute;
  bottom: 52px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.6rem;
  letter-spacing: 0.16em;
  color: var(--gold);
  text-transform: uppercase;
  white-space: nowrap;
  z-index: 10;
  pointer-events: none;
  text-shadow: 0 1px 8px #000, 0 0 20px #000;
}

.digital-wrap {
  margin-top: 16px;
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.digital {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3.8rem;
  letter-spacing: 0.06em;
  color: var(--gold-bright);
  text-shadow: 0 0 24px rgba(200, 168, 75, 0.5);
  transition: color 0.25s;
}

.digital.hour-mode {
  color: var(--orange-bright);
  text-shadow: 0 0 24px rgba(255, 144, 64, 0.5);
}

.digital .sep {
  color: var(--dim);
  animation: blink 1s step-end infinite;
}

@keyframes blink {
  50% { opacity: 0.2; }
}

.panel {
  margin-top: 20px;
  background: #0e0e1c;
  border: 1px solid #1e1e30;
  border-radius: 14px;
  padding: 16px 20px;
  width: 500px;
  max-width: 100%;
}

.panel h3 {
  font-size: 0.6rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
}

.row {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.row input[type=text],
.row input[type=number] {
  background: #080810;
  border: 1px solid #2a2a3e;
  border-radius: 6px;
  color: var(--white);
  padding: 7px 10px;
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  flex: 1;
  min-width: 0;
}

.row input[type=file] {
  color: var(--dim);
  font-size: 0.68rem;
  flex: 1;
}

.btn {
  background: var(--gold);
  color: #080810;
  border: none;
  border-radius: 6px;
  padding: 7px 16px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem;
  letter-spacing: 0.1em;
  cursor: pointer;
  white-space: nowrap;
}

.btn:hover { background: var(--gold-bright); }
.btn:disabled { background: #333; color: #666; cursor: not-allowed; }

.status {
  font-size: 0.65rem;
  color: var(--dim);
  margin-top: 6px;
  min-height: 1.1em;
}

.status.ok { color: #6dbf67; }
.status.err { color: #e05555; }

#ai-result {
  margin-top: 14px;
  background: #080810;
  border: 1px solid #1e1e2e;
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 0.68rem;
  line-height: 1.7;
  color: #aaaabe;
  white-space: pre-wrap;
  max-height: 280px;
  overflow-y: auto;
  display: none;
}

@media (max-width: 560px) {
  :root { --cs: 340px; }
  #celeb-img { width: 194px; height: 194px; }
  .digital { font-size: 2.8rem; }
}
</style>
</head>
<body>

<div class="title">CelebClock</div>
<div id="mode-banner">Minute Mode - click any tick or hour numeral</div>

<div class="clock-wrap">
  <div id="celeb-wrap">
    <img id="celeb-img" src="" alt="Celebrity" />
  </div>
  <div id="celeb-name-label"></div>

  <svg id="clock-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
    <circle cx="250" cy="250" r="248" fill="transparent" stroke="#181828" stroke-width="2"/>
    <circle cx="250" cy="250" r="238" fill="none" stroke="#141422" stroke-width="1"/>
    <g id="g-ticks"></g>
    <g id="g-hours"></g>
    <circle id="hour-target-marker" cx="250" cy="62" r="9" fill="#ff2b2b" stroke="#ffe3e3" stroke-width="2"/>
    <line id="hour-hand" x1="250" y1="250" x2="250" y2="160"/>
    <circle cx="250" cy="250" r="7" fill="var(--gold)" opacity="0.9"/>
    <circle cx="250" cy="250" r="3" fill="#0b0b16"/>
  </svg>
</div>

<div class="digital-wrap">
  <div class="digital" id="dig-h">--</div>
  <div class="digital"><span class="sep">:</span></div>
  <div class="digital" id="dig-m">--</div>
</div>

<div class="panel">
  <h3>Load Celebrity Image</h3>
  <div class="row">
    <input type="text" id="inp-url" placeholder="Image URL (https://...)" />
  </div>
  <div class="row">
    <button class="btn" id="btn-load">Load</button>
    <button class="btn" id="btn-test-mode" type="button">Test Mode: Off</button>
  </div>
  <div class="row" id="test-time-row" style="display:none;">
    <input type="text" id="inp-test-time" placeholder="HH:MM or minute" style="max-width:180px;" />
    <button class="btn" id="btn-apply-test" type="button">Apply Time</button>
  </div>
  <div class="row">
    <input type="file" id="inp-file" accept="image/*" />
  </div>
  <div class="row">
    <input type="text" id="inp-name" placeholder="Celebrity name" value="Muhammad Ali" />
    <input type="number" id="inp-min" placeholder="Override minute 0-59" min="0" max="59" style="width:130px;flex:none"/>
    <button class="btn" id="btn-ai" disabled>AI Adjust</button>
  </div>
  <div class="status" id="status-msg">Load an image to get started</div>
  <div id="ai-result"></div>
</div>

<script>
const CX = 250, CY = 250;
const R_TICK_O = 230;
const R_TICK_MI = 214;
const R_TICK_HI = 204;
const R_HOUR_C = 188;
const R_HOUR_CR = 18;
const R_HAND = 130;

let curHour = 12;
let curMinute = 0;
let hourMode = false;
let loadedSrc = null;
let isTestMode = false;
let clockTimerId = null;

function polar(r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function drawTicks() {
  const g = document.getElementById('g-ticks');
  for (let m = 0; m < 60; m++) {
    const angle = m * 6;
    const isHour = m % 5 === 0;
    const rInner = isHour ? R_TICK_HI : R_TICK_MI;
    const [ox, oy] = polar(R_TICK_O, angle);
    const [ix, iy] = polar(rInner, angle);

    const hit = svgEl('line', {
      x1: ox, y1: oy, x2: ix, y2: iy,
      stroke: 'transparent', 'stroke-width': 20, style: 'cursor:pointer'
    });
    hit.addEventListener('click', () => onTickClick(m));
    g.appendChild(hit);

    const tick = svgEl('line', {
      id: `tick-${m}`,
      x1: ox, y1: oy, x2: ix, y2: iy,
      stroke: isHour ? 'var(--tick-hour)' : 'var(--tick-color)',
      'stroke-width': isHour ? 4 : 2.5,
      'stroke-linecap': 'round'
    });
    g.appendChild(tick);
  }
}

function drawHourGroups() {
  const g = document.getElementById('g-hours');
  for (let h = 1; h <= 12; h++) {
    const angle = h * 30;
    const [hx, hy] = polar(R_HOUR_C, angle);

    const circ = svgEl('circle', {
      id: `hc-${h}`,
      cx: hx,
      cy: hy,
      r: R_HOUR_CR,
      fill: 'var(--dimmer)',
      'fill-opacity': '0.35',
      stroke: 'var(--dim)',
      'stroke-opacity': '0.6',
      'stroke-width': 1.5,
      style: 'cursor:pointer'
    });
    circ.addEventListener('click', () => onHourCircleClick(h));
    g.appendChild(circ);

    const txt = svgEl('text', {
      id: `ht-${h}`,
      x: hx,
      y: hy,
      'text-anchor': 'middle',
      'dominant-baseline': 'central',
      fill: 'var(--white)',
      style: "font-family:'Bebas Neue',sans-serif; font-size:15px; pointer-events:none"
    });
    txt.textContent = h;
    g.appendChild(txt);
  }
}

function onTickClick(m) {
  if (hourMode) return;
  setMinute(m);
}

function onHourCircleClick(h) {
  if (hourMode) {
    setHour(h);
    exitHourMode();
  } else {
    setMinute((h * 5) % 60);
  }
}

document.getElementById('hour-hand').addEventListener('click', () => {
  if (!hourMode) enterHourMode();
});

function enterHourMode() {
  hourMode = true;
  document.getElementById('hour-hand').classList.add('hour-mode');
  document.getElementById('mode-banner').textContent = 'Hour Mode - click an hour numeral to set hour';
  document.getElementById('mode-banner').classList.add('hour-mode');
  document.getElementById('dig-h').classList.add('hour-mode');
  document.getElementById('dig-m').classList.add('hour-mode');
}

function exitHourMode() {
  hourMode = false;
  document.getElementById('hour-hand').classList.remove('hour-mode');
  document.getElementById('mode-banner').textContent = 'Minute Mode - click any tick or hour numeral';
  document.getElementById('mode-banner').classList.remove('hour-mode');
  document.getElementById('dig-h').classList.remove('hour-mode');
  document.getElementById('dig-m').classList.remove('hour-mode');
}

function setMinute(m) {
  curMinute = m;
  updateClock();
  onMinuteChanged(m);
}

function setHour(h) {
  curHour = h;
  updateClock();
}

function updateClock() {
  for (let m = 0; m < 60; m++) {
    const t = document.getElementById(`tick-${m}`);
    if (!t) continue;
    const isHour = m % 5 === 0;
    const isActive = m === curMinute;
    if (isActive) {
      t.setAttribute('stroke', 'var(--active-tick)');
      t.setAttribute('stroke-width', isHour ? 6 : 4.5);
    } else {
      t.setAttribute('stroke', isHour ? 'var(--tick-hour)' : 'var(--tick-color)');
      t.setAttribute('stroke-width', isHour ? 4 : 2.5);
    }
  }

  for (let h = 1; h <= 12; h++) {
    const m = (h * 5) % 60;
    const active = m === curMinute;
    const c = document.getElementById(`hc-${h}`);
    const t = document.getElementById(`ht-${h}`);
    if (c) {
      c.setAttribute('fill', active ? 'var(--gold)' : 'var(--dimmer)');
      c.setAttribute('fill-opacity', active ? '0.95' : '0.35');
      c.setAttribute('stroke', active ? 'var(--gold-bright)' : 'var(--dim)');
      c.setAttribute('stroke-opacity', active ? '1' : '0.6');
    }
    if (t) t.setAttribute('fill', active ? '#080810' : 'var(--white)');
  }

  const totalMins = ((curHour % 12) * 60) + curMinute;
  const handAngle = totalMins * 0.5;
  const [hx, hy] = polar(R_HAND, handAngle);
  const hand = document.getElementById('hour-hand');
  hand.setAttribute('x2', hx);
  hand.setAttribute('y2', hy);

  // Red target marker tracks the currently selected minute automatically.
  const [tx, ty] = polar(R_HOUR_C, curMinute * 6);
  const marker = document.getElementById('hour-target-marker');
  marker.setAttribute('cx', tx);
  marker.setAttribute('cy', ty);

  document.getElementById('dig-h').textContent = String(curHour).padStart(2, '0');
  document.getElementById('dig-m').textContent = String(curMinute).padStart(2, '0');
}

function onMinuteChanged(m) {
  const lbl = document.getElementById('celeb-name-label');
  const base = lbl.dataset.celeb || '';
  if (base) lbl.textContent = `${base}  |  min ${String(m).padStart(2, '0')}`;
}

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

function loadImage(src, name, overrideMin) {
  const img = document.getElementById('celeb-img');
  const lbl = document.getElementById('celeb-name-label');

  img.onerror = () => {
    setStatus('Image failed to load. Try a different URL or file.', 'err');
    img.style.display = 'none';
  };

  img.onload = () => {
    img.style.display = 'block';
    setStatus('Loaded: ' + name, 'ok');
    document.getElementById('btn-ai').disabled = false;
  };

  loadedSrc = src;
  img.src = src;
  lbl.dataset.celeb = name;
  lbl.textContent = name;

  if (overrideMin !== null && overrideMin !== undefined && !Number.isNaN(overrideMin)) {
    setMinute(overrideMin);
  }
}

document.getElementById('btn-load').addEventListener('click', () => {
  const urlVal = document.getElementById('inp-url').value.trim();
  const name = document.getElementById('inp-name').value.trim() || 'Celebrity';
  const min = parseInt(document.getElementById('inp-min').value, 10);
  const src = (loadedSrc && loadedSrc.startsWith('data:')) ? loadedSrc : urlVal;

  if (!src) {
    setStatus('Please enter an image URL or pick a file', 'err');
    return;
  }

  setStatus('Loading image...', '');
  loadImage(src, name, Number.isNaN(min) ? null : min);
});

document.getElementById('inp-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const name = document.getElementById('inp-name').value.trim() || file.name.replace(/[.][^.]+$/, '');
  const min = parseInt(document.getElementById('inp-min').value, 10);
  const reader = new FileReader();

  reader.onload = (ev) => {
    loadedSrc = ev.target.result;
    document.getElementById('inp-url').value = '(local file: ' + file.name + ')';
    loadImage(loadedSrc, name, Number.isNaN(min) ? null : min);
  };

  reader.readAsDataURL(file);
});

document.getElementById('btn-ai').addEventListener('click', () => {
  const minute = parseInt(document.getElementById('inp-min').value, 10);
  if (Number.isNaN(minute) || minute < 0 || minute > 59) {
    setStatus('Enter a target minute 0-59 first', 'err');
    return;
  }

  const angle = minute * 6;
  const hEquiv = Math.round(minute / 5) || 12;
  const name = document.getElementById('inp-name').value.trim() || 'Celebrity';
  const box = document.getElementById('ai-result');

  box.style.display = 'block';
  box.textContent =
    `${name} -> minute ${minute} (${angle} deg)\n\n` +
    `AI placeholder: connect your model API here to generate pose-adjust instructions for ${hEquiv} o'clock.`;
  setStatus('AI placeholder generated', 'ok');
});

function syncToRealTime() {
  if (isTestMode) return;
  const now = new Date();
  curHour = now.getHours() % 12 || 12;
  curMinute = now.getMinutes();
  updateClock();
}

function startRealtimeClock() {
  stopRealtimeClock();
  syncToRealTime();

  // Align updates to minute boundaries, then tick every 60s.
  const now = new Date();
  const msToNextMinute = ((60 - now.getSeconds()) * 1000) - now.getMilliseconds();
  clockTimerId = setTimeout(() => {
    syncToRealTime();
    clockTimerId = setInterval(syncToRealTime, 60000);
  }, Math.max(1, msToNextMinute));
}

function stopRealtimeClock() {
  if (clockTimerId) {
    clearTimeout(clockTimerId);
    clearInterval(clockTimerId);
    clockTimerId = null;
  }
}

function applyTestTimeInput() {
  const raw = document.getElementById('inp-test-time').value.trim();
  if (!raw) {
    setStatus('Enter HH:MM or minute', 'err');
    return;
  }

  let nextHour = curHour;
  let nextMinute = curMinute;

  if (raw.includes(':')) {
    const [h, m] = raw.split(':');
    nextHour = Number(h);
    nextMinute = Number(m);
  } else {
    const digits = raw.replace(/\D/g, '');
    if (!digits) {
      setStatus('Invalid test time', 'err');
      return;
    }
    if (digits.length <= 2) {
      nextMinute = Number(digits);
    } else {
      const h = digits.slice(0, digits.length - 2);
      const m = digits.slice(-2);
      nextHour = Number(h);
      nextMinute = Number(m);
    }
  }

  if (!Number.isFinite(nextHour) || !Number.isFinite(nextMinute) || nextMinute < 0 || nextMinute > 59) {
    setStatus('Invalid test time', 'err');
    return;
  }

  nextHour = ((nextHour % 12) + 12) % 12 || 12;
  setHour(nextHour);
  setMinute(nextMinute);
  setStatus(`Test time set: ${String(nextHour).padStart(2, '0')}:${String(nextMinute).padStart(2, '0')}`, 'ok');
}

function setTestMode(enabled) {
  isTestMode = enabled;
  const row = document.getElementById('test-time-row');
  const btn = document.getElementById('btn-test-mode');

  row.style.display = enabled ? 'flex' : 'none';
  btn.textContent = enabled ? 'Test Mode: On' : 'Test Mode: Off';

  if (enabled) {
    stopRealtimeClock();
    setStatus('Test mode enabled: enter time and click Apply Time', 'ok');
  } else {
    startRealtimeClock();
    setStatus('Returned to realtime clock', 'ok');
  }
}

document.getElementById('btn-test-mode').addEventListener('click', () => {
  setTestMode(!isTestMode);
});

document.getElementById('btn-apply-test').addEventListener('click', applyTestTimeInput);

document.getElementById('inp-test-time').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    applyTestTimeInput();
  }
});

drawTicks();
drawHourGroups();
startRealtimeClock();

const START_MINUTE = 5;
const START_INDEX = 0;
const PREFERRED_CELEB_BY_MINUTE = {
  5: 'David Bowie',
  9: 'Muhammad Ali'
};

async function loadStartupFromMinute(minute, index) {
  document.getElementById('inp-min').value = String(minute).padStart(2, '0');

  try {
    const res = await fetch('setup/data/celebMinutes.json');
    if (!res.ok) throw new Error('startup json fetch failed');
    const rows = await res.json();

    const candidates = rows.filter((r) => Number(r.minute) === minute);
    if (!candidates.length) throw new Error('no minute candidates');

    const preferred = PREFERRED_CELEB_BY_MINUTE[minute];
    candidates.sort((a, b) => {
      const aPreferred = preferred && a.celeb === preferred ? 1 : 0;
      const bPreferred = preferred && b.celeb === preferred ? 1 : 0;
      return bPreferred - aPreferred;
    });

    const pick = candidates[index] || candidates[0];
    const src = pick.filename ? `imgs/${pick.filename}` : pick.sourceUrl;
    const name = pick.celeb || 'Celebrity';

    if (!src) throw new Error('empty startup source');

    document.getElementById('inp-url').value = src;
    document.getElementById('inp-name').value = name;
    loadImage(src, name, minute);
    return;
  } catch (err) {
    // Fallback keeps app usable if JSON fetch/select fails.
    const fallbackSrc = 'imgs/05-davidbowie.jpg';
    document.getElementById('inp-url').value = fallbackSrc;
    document.getElementById('inp-name').value = 'David Bowie';
    loadImage(fallbackSrc, 'David Bowie', minute);
  }
}

loadStartupFromMinute(START_MINUTE, START_INDEX);
</script>
</body>
</html>
