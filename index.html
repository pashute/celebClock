<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CelebClock</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #080810;
  --face-bg: #0d0d1a;
  --gold: #c8a84b;
  --gold-bright: #f0d060;
  --orange: #e87020;
  --orange-bright: #ff9040;
  --white: #eeebe4;
  --dim: #44445a;
  --dimmer: #2a2a3a;
  --tick-color: #6060a0;
  --tick-hour: #9090c0;
  --active-tick: #c8a84b;
  --cs: 500px; /* clock size */
  --cr: 250px; /* clock radius */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--white);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  gap: 0;
}

/* title */
.title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.8rem;
  letter-spacing: 0.25em;
  color: var(--gold);
  margin-bottom: 8px;
  text-shadow: 0 0 30px rgba(200,168,75,0.3);
}

/* mode banner */
#mode-banner {
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 4px 16px;
  border-radius: 20px;
  margin-bottom: 18px;
  border: 1px solid var(--gold);
  color: var(--gold);
  background: rgba(200,168,75,0.08);
  transition: all 0.25s;
}
#mode-banner.hour-mode {
  border-color: var(--orange);
  color: var(--orange-bright);
  background: rgba(232,112,32,0.1);
}

/* clock wrapper */
.clock-wrap {
  position: relative;
  width: var(--cs);
  height: var(--cs);
}

/* celeb image — behind everything */
#celeb-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  pointer-events: none;
  border-radius: 50%;
}
#celeb-img {
  width: 440px;
  height: 440px;
  object-fit: cover;
  object-position: center top;
  border-radius: 0;
  opacity: 0.92;
  transition: opacity 0.5s ease;
  filter: drop-shadow(0 0 24px rgba(200,168,75,0.3));
}

/* SVG face on top of celeb image */
#clock-svg {
  position: absolute;
  inset: 0;
  z-index: 2;
}

/* hour hand */
#hour-hand {
  stroke: var(--gold-bright);
  stroke-width: 6;
  stroke-linecap: round;
  cursor: pointer;
  filter: drop-shadow(0 0 5px rgba(240,208,96,0.7));
  transition: stroke 0.2s, filter 0.2s;
}
#hour-hand.hour-mode {
  stroke: var(--orange-bright);
  filter: drop-shadow(0 0 8px rgba(255,144,64,0.9));
  cursor: default;
}

/* celeb name label */
#celeb-name-label {
  position: absolute;
  bottom: 52px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.6rem;
  letter-spacing: 0.16em;
  color: var(--gold);
  text-transform: uppercase;
  white-space: nowrap;
  z-index: 10;
  pointer-events: none;
  text-shadow: 0 1px 8px #000, 0 0 20px #000;
}

/* digital clock */
.digital-wrap {
  margin-top: 16px;
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.digital {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3.8rem;
  letter-spacing: 0.06em;
  color: var(--gold-bright);
  text-shadow: 0 0 24px rgba(200,168,75,0.5);
  transition: color 0.25s;
}
.digital.hour-mode { color: var(--orange-bright); text-shadow: 0 0 24px rgba(255,144,64,0.5); }
.digital .sep { color: var(--dim); animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0.2; } }

/* AI panel */
.panel {
  margin-top: 20px;
  background: #0e0e1c;
  border: 1px solid #1e1e30;
  border-radius: 14px;
  padding: 16px 20px;
  width: 500px;
  max-width: 100%;
}
.panel h3 {
  font-size: 0.6rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
}
.row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
.row input[type=text], .row input[type=number] {
  background: #080810; border: 1px solid #2a2a3e;
  border-radius: 6px; color: var(--white);
  padding: 7px 10px; font-family: 'DM Mono', monospace;
  font-size: 0.72rem; flex: 1; min-width: 0;
}
.row input[type=file] { color: var(--dim); font-size: 0.68rem; flex: 1; }
.btn {
  background: var(--gold); color: #080810;
  border: none; border-radius: 6px;
  padding: 7px 16px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem; letter-spacing: 0.1em;
  cursor: pointer; white-space: nowrap;
  transition: background 0.2s;
}
.btn:hover { background: var(--gold-bright); }
.btn:disabled { background: #333; color: #666; cursor: not-allowed; }
.status { font-size: 0.65rem; color: var(--dim); margin-top: 6px; min-height: 1.1em; }
.status.ok { color: #6dbf67; }
.status.err { color: #e05555; }

#ai-result {
  margin-top: 14px; background: #080810; border: 1px solid #1e1e2e;
  border-radius: 8px; padding: 12px 14px;
  font-size: 0.68rem; line-height: 1.7; color: #aaaabe;
  white-space: pre-wrap; max-height: 280px; overflow-y: auto;
  display: none;
}
</style>
</head>
<body>

<div class="title">CelebClock</div>
<div id="mode-banner">● Minute Mode — click any tick or hour numeral</div>

<div class="clock-wrap">
  <!-- Celeb image behind -->
  <div id="celeb-wrap">
    <img id="celeb-img" src="" alt="" style="display:none"/>
  </div>
  <div id="celeb-name-label"></div>

  <!-- SVG clock face -->
  <svg id="clock-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
    <!-- Background rings -->
    <circle cx="250" cy="250" r="248" fill="transparent" stroke="#181828" stroke-width="2"/>
    <circle cx="250" cy="250" r="238" fill="none" stroke="#141422" stroke-width="1"/>

    <!-- Minute ticks (drawn by JS) -->
    <g id="g-ticks"></g>

    <!-- Hour circles (drawn by JS) -->
    <g id="g-hours"></g>

    <!-- Hour hand (on top of everything) -->
    <line id="hour-hand" x1="250" y1="250" x2="250" y2="160"/>

    <!-- Center cap -->
    <circle cx="250" cy="250" r="7" fill="var(--gold)" opacity="0.9"/>
    <circle cx="250" cy="250" r="3" fill="#0b0b16"/>
  </svg>
</div>

<div class="digital-wrap">
  <div class="digital" id="dig-h">--</div>
  <div class="digital"><span class="sep">:</span></div>
  <div class="digital" id="dig-m">--</div>
</div>

  </div>
  <div class="row">
    <input type="text" id="inp-name" placeholder="Celebrity name" value="Muhammad Ali"/>
    <input type="number" id="inp-min" placeholder="Override minute 0–59" min="0" max="59" style="width:130px;flex:none"/>
    <button class="btn" id="btn-ai" disabled>AI Adjust →</button>
  </div>
  <div class="status" id="status-msg">Load an image to get started</div>
  <div id="ai-result"></div>
</div>

<script>
// ═══════════════════════════════════════════
//  Constants & geometry
// ═══════════════════════════════════════════
const CX = 250, CY = 250;
const R_OUTER   = 238;   // clock outer edge
const R_TICK_O  = 230;   // tick outer point
const R_TICK_MI = 214;   // minute tick inner
const R_TICK_HI = 204;   // hour tick inner (longer)
const R_HOUR_C  = 188;   // hour circle centre radius
const R_HOUR_CR = 18;    // hour circle radius
const R_HAND    = 130;   // hour hand length

// ═══════════════════════════════════════════
//  State
// ═══════════════════════════════════════════
let curHour   = 12;
let curMinute = 0;
let hourMode  = false;    // false = minute mode, true = hour mode
let loadedSrc = null;

// ═══════════════════════════════════════════
//  Geometry helpers
// ═══════════════════════════════════════════
function polar(r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

// ═══════════════════════════════════════════
//  Draw static elements
// ═══════════════════════════════════════════
function drawTicks() {
  const g = document.getElementById('g-ticks');
  for (let m = 0; m < 60; m++) {
    const angle  = m * 6;
    const isHour = m % 5 === 0;
    const rInner = isHour ? R_TICK_HI : R_TICK_MI;
    const [ox, oy] = polar(R_TICK_O, angle);
    const [ix, iy] = polar(rInner, angle);

    // Wide invisible hit zone
    const hit = svgEl('line', {
      x1: ox, y1: oy, x2: ix, y2: iy,
      stroke: 'transparent', 'stroke-width': 20,
      style: 'cursor:pointer'
    });
    hit.addEventListener('click', () => onTickClick(m));
    g.appendChild(hit);

    // Visible tick
    const tick = svgEl('line', {
      id: `tick-${m}`,
      x1: ox, y1: oy, x2: ix, y2: iy,
      stroke: isHour ? 'var(--tick-hour)' : 'var(--tick-color)',
      'stroke-width': isHour ? 4 : 2.5,
      'stroke-linecap': 'round'
    });
    g.appendChild(tick);
  }
}

function drawHourGroups() {
  const g = document.getElementById('g-hours');
  for (let h = 1; h <= 12; h++) {
    const angle = h * 30;
    const [hx, hy] = polar(R_HOUR_C, angle);

    // Circle background (hit area too)
    const circ = svgEl('circle', {
      id: `hc-${h}`, cx: hx, cy: hy, r: R_HOUR_CR,
      fill: 'var(--dimmer)', 'fill-opacity': '0.35', stroke: 'var(--dim)', 'stroke-opacity': '0.6', 'stroke-width': 1.5,
      style: 'cursor:pointer', class: 'hour-circle'
    });
    circ.addEventListener('click', () => onHourCircleClick(h));
    g.appendChild(circ);

    // Numeral
    const txt = svgEl('text', {
      id: `ht-${h}`, x: hx, y: hy,
      'text-anchor': 'middle', 'dominant-baseline': 'central',
      fill: 'var(--white)',
      style: "font-family:'Bebas Neue',sans-serif; font-size:15px; pointer-events:none"
    });
    txt.textContent = h;
    g.appendChild(txt);
  }
}

// ═══════════════════════════════════════════
//  Click handlers
// ═══════════════════════════════════════════
function onTickClick(m) {
  if (hourMode) {
    // In hour mode, tick clicks do nothing for hour setting
    // but the m%5 hour ticks also have hour circles on top — handled there
    return;
  }
  setMinute(m);
}

function onHourCircleClick(h) {
  if (hourMode) {
    setHour(h);
    exitHourMode();
  } else {
    setMinute(h * 5 === 60 ? 0 : h * 5);
  }
}

document.getElementById('hour-hand').addEventListener('click', () => {
  if (!hourMode) enterHourMode();
});

function enterHourMode() {
  hourMode = true;
  document.getElementById('hour-hand').classList.add('hour-mode');
  document.getElementById('mode-banner').textContent = '● Hour Mode — click an hour numeral to set hour';
  document.getElementById('mode-banner').classList.add('hour-mode');
  document.getElementById('dig-h').classList.add('hour-mode');
  document.getElementById('dig-m').classList.add('hour-mode');
}

function exitHourMode() {
  hourMode = false;
  document.getElementById('hour-hand').classList.remove('hour-mode');
  document.getElementById('mode-banner').textContent = '● Minute Mode — click any tick or hour numeral';
  document.getElementById('mode-banner').classList.remove('hour-mode');
  document.getElementById('dig-h').classList.remove('hour-mode');
  document.getElementById('dig-m').classList.remove('hour-mode');
}

// ═══════════════════════════════════════════
//  Set time
// ═══════════════════════════════════════════
function setMinute(m) {
  curMinute = m;
  updateClock();
  onMinuteChanged(m);
}

function setHour(h) {
  curHour = h;
  updateClock();
}

// ═══════════════════════════════════════════
//  Update visuals
// ═══════════════════════════════════════════
function updateClock() {
  // — Ticks —
  for (let m = 0; m < 60; m++) {
    const t = document.getElementById(`tick-${m}`);
    if (!t) continue;
    const isHour = m % 5 === 0;
    const isActive = (m === curMinute);
    if (isActive) {
      t.setAttribute('stroke', 'var(--active-tick)');
      t.setAttribute('stroke-width', isHour ? 6 : 4.5);
    } else {
      t.setAttribute('stroke', isHour ? 'var(--tick-hour)' : 'var(--tick-color)');
      t.setAttribute('stroke-width', isHour ? 4 : 2.5);
    }
  }

  // — Hour circles —
  for (let h = 1; h <= 12; h++) {
    const m = (h * 5) % 60;
    const active = (m === curMinute);
    const c = document.getElementById(`hc-${h}`);
    const t = document.getElementById(`ht-${h}`);
    if (c) {
      c.setAttribute('fill', active ? 'var(--gold)' : 'var(--dimmer)');
      c.setAttribute('fill-opacity', active ? '0.95' : '0.35');
      c.setAttribute('stroke', active ? 'var(--gold-bright)' : 'var(--dim)');
      c.setAttribute('stroke-opacity', active ? '1' : '0.6');
    }
    if (t) t.setAttribute('fill', active ? '#080810' : 'var(--white)');
  }

  // — Hour hand —
  const totalMins = ((curHour % 12) * 60) + curMinute;
  const handAngle = totalMins * 0.5; // 360/720
  const [hx, hy] = polar(R_HAND, handAngle);
  const hand = document.getElementById('hour-hand');
  hand.setAttribute('x2', hx);
  hand.setAttribute('y2', hy);

  // — Digital —
  document.getElementById('dig-h').textContent = String(curHour).padStart(2, '0');
  document.getElementById('dig-m').textContent = String(curMinute).padStart(2, '0');
}

// ═══════════════════════════════════════════
//  Celeb image update when minute changes
// ═══════════════════════════════════════════
function onMinuteChanged(m) {
  // In the full app this will trigger AI or swap static image.
  // For now: image stays, label shows the minute.
  const lbl = document.getElementById('celeb-name-label');
  const base = lbl.dataset.celeb || '';
  if (base) lbl.textContent = `${base}  ·  min ${String(m).padStart(2,'0')}`;
}

// ═══════════════════════════════════════════
//  Image loading
// ═══════════════════════════════════════════
function loadImage(src, name, overrideMin) {
  const img = document.getElementById('celeb-img');
  const lbl = document.getElementById('celeb-name-label');

  img.onerror = () => {
    // URL failed — if we have a loadedSrc that's a data URL, use that instead
    if (loadedSrc && loadedSrc.startsWith('data:') && img.src !== loadedSrc) {
      img.src = loadedSrc;
    } else {
      setStatus('⚠ URL blocked. Use the file picker to upload directly.', 'err');
      img.style.display = 'none';
    }
  };
  img.onload = () => {
    img.style.display = 'block';
    setStatus('Loaded: ' + name, 'ok');
    document.getElementById('btn-ai').disabled = false;
  };
  // Use data URL directly if available, otherwise try the src URL
  loadedSrc = src;
  img.src = src;

  lbl.dataset.celeb = name;
  lbl.textContent = name;

  if (overrideMin !== null && overrideMin !== undefined && !isNaN(overrideMin)) {
    setMinute(overrideMin);
  }
}

document.getElementById('btn-load').addEventListener('click', () => {
  const urlVal = document.getElementById('inp-url').value.trim();
  const name   = document.getElementById('inp-name').value.trim() || 'Celebrity';
  const min    = parseInt(document.getElementById('inp-min').value);
  // If a local file was picked (loadedSrc is data URL), use that regardless of url field
  const src = (loadedSrc && loadedSrc.startsWith('data:')) ? loadedSrc : urlVal;
  if (!src) { setStatus('Please enter an image URL or pick a file', 'err'); return; }
  setStatus('Loading image…', '');
  loadImage(src, name, isNaN(min) ? null : min);
});

document.getElementById('inp-file').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const name = document.getElementById('inp-name').value.trim() || file.name.replace(/[.][^.]+$/, '');
  const min  = parseInt(document.getElementById('inp-min').value);
  const reader = new FileReader();
  reader.onload = ev => {
    loadedSrc = ev.target.result;
    // Update the URL field to show it came from a local file
    document.getElementById('inp-url').value = '(local file: ' + file.name + ')';
    loadImage(ev.target.result, name, isNaN(min) ? null : min);
  };
  reader.readAsDataURL(file);
});

// ═══════════════════════════════════════════
//  AI Adjust
// ═══════════════════════════════════════════
document.getElementById('btn-ai').addEventListener('click', async () => {
  const minute = parseInt(document.getElementById('inp-min').value);
  const name   = document.getElementById('inp-name').value.trim() || 'the celebrity';
  if (isNaN(minute) || minute < 0 || minute > 59) {
    setStatus('Enter a target minute 0–59 first', 'err'); return;
  }
  const angle = minute * 6;
  const hEquiv = Math.round(minute / 5) || 12;

  const prompt = `You are an expert image editor and art director for an animated clock application.

The image shows ${name}. They will serve as the "minute hand" of a clock, displayed centered behind the clock face.

Target: minute ${minute} on the clock face.
- Clock angle: ${angle}° clockwise from 12 o'clock (straight up)
- Equivalent to the ${hEquiv} o'clock position

Please provide:
1. ANALYSIS: Describe the current arm/finger pointing direction in the image (estimate the clock angle it currently shows)
2. DELTA: How many degrees of correction are needed, and in which direction
3. EDITING INSTRUCTIONS: Step-by-step description for an AI image editor to reposition the arm, hand, and finger to point at ${angle}°. Include how to naturally rotate the shoulder, adjust elbow, and reorient the gaze/face toward the new direction.
4. IMAGE GEN PROMPT: A complete Stable Diffusion / DALL-E prompt that would generate ${name} from scratch pointing at exactly the ${hEquiv} o'clock position (${angle}°), matching the style and mood of the original photo.

Be precise and technically accurate.`;

  const btn = document.getElementById('btn-ai');
  btn.disabled = true;
  setStatus('Consulting AI…', '');

  try {
    let userContent;
    if (loadedSrc && loadedSrc.startsWith('data:')) {
      const [hdr, b64] = loadedSrc.split(',');
      const mt = hdr.match(/data:([^;]+)/)[1];
      userContent = [
        { type: 'image', source: { type: 'base64', media_type: mt, data: b64 } },
        { type: 'text', text: prompt }
      ];
    } else {
      // URL-based — pass as text only (CORS may block base64 fetch)
      userContent = `[Image URL: ${loadedSrc}]\n\n${prompt}`;
    }

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: userContent }]
      })
    });
    const data = await res.json();
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    if (!text) throw new Error('Empty response');

    const box = document.getElementById('ai-result');
    box.style.display = 'block';
    box.innerHTML = `<span style="color:var(--gold);font-family:'Bebas Neue';font-size:1.1rem;letter-spacing:.1em">${name} → Minute ${minute} (${angle}°)</span>\n\n${text}`;
    setStatus('AI analysis ready ↓', 'ok');
    setMinute(minute);
  } catch(err) {
    setStatus('AI error: ' + err.message, 'err');
  } finally {
    btn.disabled = false;
  }
});

// ═══════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════
function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

// ═══════════════════════════════════════════
//  Live clock sync (every 30s, non-disruptive)
// ═══════════════════════════════════════════
function syncToRealTime() {
  const now = new Date();
  curHour   = now.getHours() % 12 || 12;
  curMinute = now.getMinutes();
  updateClock();
}

// ═══════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════
drawTicks();
drawHourGroups();
syncToRealTime();
setInterval(syncToRealTime, 30000);
